services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trenda}
      POSTGRES_DB: ${POSTGRES_DB:-trenda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trenda} -d ${POSTGRES_DB:-trenda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever is in backend/.env so the app talks to the db service.
      DATABASE_URL: postgres://${POSTGRES_USER:-trenda}:${POSTGRES_PASSWORD:-trenda}@db:5432/${POSTGRES_DB:-trenda}
      NODE_ENV: production
      PORT: 3000
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

volumes:
  pgdata:
